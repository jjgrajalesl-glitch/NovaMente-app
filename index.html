function detectarIdioma(){
  const p = (new URLSearchParams(location.search).get("lang") || "").slice(0,2).toLowerCase();
  if(TXT[p]){ try{ localStorage.setItem("nm_lang", JSON.stringify(p)); }catch(e){} return p; }
  try{ const g = JSON.parse(localStorage.getItem("nm_lang")); if(TXT[g]) return g; }catch(e){}
  const navs = (navigator.languages && navigator.languages.length) ? navigator.languages : [navigator.language || "en"];
  for(const l of navs){ const c = String(l).slice(0,2).toLowerCase(); if(TXT[c]) return c; }
  return "en";
}
const LANG = detectarIdioma(), T = TXT[LANG], $ = id => document.getElementById(id);
const usd = n => "USD " + n.toFixed(2).replace(".", LANG === "en" ? "." : ",");
const listo = u => u && u.indexOf("PEGA_") === -1;
let periodo = "anual";

function pintarPlanes(){
  const planes = [["basico",T.pBas,T.fBas,false],["intermedio",T.pInt,T.fInt,true],["experto",T.pExp,T.fExp,false]];
  $("planesGrid").innerHTML = planes.map(([k,nom,feats,top]) => {
    const p = PRECIOS[k], anual = periodo === "anual";
    const precio = anual ? p.anual : p.mes;
    const equiv = anual ? T.equivY.replace("{m}", usd(p.anual/12)) : T.equivM;
    const link = CONFIG.CHECKOUT[k + "_" + (anual ? "anual" : "mes")];
    const activo = CONFIG.PLANES_ACTIVOS && listo(link);
    const badge = !CONFIG.PLANES_ACTIVOS ? '<span class="badge">'+T.soon+'</span> ' : (top ? '<span class="badge">'+T.popular+'</span>' : '');
    const btn = activo ? '<a class="btn btn-main" style="width:100%" href="'+link+'" target="_blank" rel="noopener">'+T.choose+'</a>'
                       : '<button class="btn btn-light" data-aviso="1">'+T.notify+'</button>';
    return '<div class="card plan'+(top?' top':'')+'">'+badge+'<h3>'+nom+'</h3>'+
           '<div class="precio">'+usd(precio)+' <small>'+(anual?T.perYear:T.perMonth)+'</small></div>'+
           '<div class="equiv">'+equiv+'</div><ul>'+feats.map(f=>'<li>'+f+'</li>').join("")+'</ul>'+btn+'</div>';
  }).join("");
  document.querySelectorAll("[data-aviso]").forEach(b => b.onclick = () => { $("aviso").style.display = "block"; $("email").focus(); });
}

    try{
      let { error } = await db.from("suscriptores").insert({ email, idioma: LANG });
      if(error && /idioma/i.test(error.message || "")) ({ error } = await db.from("suscriptores").insert({ email }));
      ok = !error || error.code === "23505";
    }catch(e){ ok = false; }
  }
  if(ok){ $("emailMsg").textContent = T.ok; $("email").style.display = "none"; $("bEmail").style.display = "none"; }
  else { $("emailMsg").textContent = T.err; $("bEmail").disabled = false; }
}

/* Textos, links y arranque */
document.documentElement.lang = LANG; document.title = T.doc;
document.querySelectorAll("[data-t]").forEach(el => { const v = T[el.dataset.t]; if(typeof v === "string") el.textContent = v; });
$("email").placeholder = T.ph;
$("bReto").href = CONFIG.RETO_URL + "?lang=" + LANG;
const tg = CONFIG.TELEGRAM[LANG];
[$("bTg"), $("bTg2")].forEach(b => { if(listo(tg)) b.href = tg; else b.style.display = "none"; });
if(listo(CONFIG.TERMINOS_URL)) $("lTer").href = CONFIG.TERMINOS_URL;
if(listo(CONFIG.PRIVACIDAD_URL)) $("lPri").href = CONFIG.PRIVACIDAD_URL;
if(listo(CONFIG.CANCELAR_URL)) $("lCan").href = CONFIG.CANCELAR_URL;
$("lCon").href = "mailto:" + CONFIG.CONTACTO;
$("anio").textContent = new Date().getFullYear();
$("tAnual").onclick = () => { periodo = "anual"; $("tAnual").classList.add("on"); $("tMes").classList.remove("on"); pintarPlanes(); };
$("tMes").onclick = () => { periodo = "mes"; $("tMes").classList.add("on"); $("tAnual").classList.remove("on"); pintarPlanes(); };
$("bEmail").onclick = suscribir;
document.querySelectorAll("#langs a").forEach(a => {
  if(a.dataset.l === LANG) a.classList.add("on");
  a.onclick = () => { try{ localStorage.setItem("nm_lang", JSON.stringify(a.dataset.l)); }catch(e){} const u = new URL(location.href); u.searchParams.delete("lang"); location.href = u.toString(); };
});
pintarPlanes();
</script>
</body>
